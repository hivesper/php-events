name: CI

on:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: json, pdo, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: php-cs-fixer
        run: composer test:cs

      - name: PHPStan
        run: composer test:stan

      - name: Unit tests
        run: composer test:unit

      - name: Feature tests
        run: composer test:feature
